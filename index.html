<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COUPLE - Bespoke Engagement Rings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Main Container -->
  <div class="page-wrapper">

    <!-- Navigation Header -->
    <header class="navbar">
      <nav class="nav-left">
        <a href="#" class="nav-link">ENGAGEMENT</a>
        <a href="#" class="nav-link">BANDS</a>
        <a href="#" class="nav-link">LEARN</a>
      </nav>

      <div class="nav-brand">
        <div class="sunburst-logo">
          <svg width="28" height="18" viewBox="0 0 28 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <line x1="14" y1="0" x2="14" y2="5" stroke="#101835" stroke-width="1.3" stroke-linecap="round"/>
            <line x1="8" y1="2.5" x2="10.5" y2="6" stroke="#101835" stroke-width="1.3" stroke-linecap="round"/>
            <line x1="20" y1="2.5" x2="17.5" y2="6" stroke="#101835" stroke-width="1.3" stroke-linecap="round"/>
            <line x1="3" y1="7.5" x2="7" y2="9" stroke="#101835" stroke-width="1.3" stroke-linecap="round"/>
            <line x1="25" y1="7.5" x2="21" y2="9" stroke="#101835" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="brand-title">COUPLE</span>
      </div>

      <nav class="nav-right">
        <a href="#" class="nav-link">SUPPORT</a>
        <a href="#" class="nav-link">SIGN IN</a>
        <a href="#" class="cart-icon" aria-label="Shopping Cart">
          <svg width="18" height="20" viewBox="0 0 18 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 6V4.5C4 2.567 5.567 1 7.5 1H10.5C12.433 1 14 2.567 14 4.5V6" stroke="#101835" stroke-width="1.5"/>
            <path d="M1.5 6H16.5L15.5 18.5H2.5L1.5 6Z" stroke="#101835" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
        </a>
      </nav>
    </header>

    <!-- Hero Content Area -->
    <main class="hero-section">
      <div class="hero-left">
        <h1 class="hero-headline">The Joy of a<br>Shared Life</h1>
        <p class="hero-subtext">Introducing a collection of bespoke<br>rings that live up to the moment.</p>
        <a href="#" class="cta-button">SHOP ENGAGEMENT</a>
      </div>

      <div class="hero-right">
        <img src="assets/woman-clean.png" alt="Joyful woman holding yellow bouquet" class="hero-image">
      </div>
    </main>

    <!-- Angled White Table Bottom Bar -->
    <div class="bottom-shelf">
      <div class="arrow-container">
        <svg width="12" height="36" viewBox="0 0 12 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="6" y1="0" x2="6" y2="32" stroke="#101835" stroke-width="1"/>
          <path d="M2 28L6 32L10 28" stroke="#101835" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <!-- Floating Chat Widget -->
    <div class="chat-widget">
      <span>Chat with us.</span>
    </div>

  </div>

</body>
</html>
